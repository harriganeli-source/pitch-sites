<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Mulish:wght@600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:'Mulish',sans-serif;color:#FBF9F4;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:url('../../assets/cloudy-hero.jpg') center 97%/150% auto no-repeat;filter:contrast(.82) saturate(.85)}
.sh{position:absolute;inset:0;background:rgba(26,36,48,.5)}
.lock{position:relative;top:30px;text-align:center;filter:drop-shadow(0 2px 18px rgba(10,20,35,.45))}
.lock img{display:block;margin:0 auto;height:210px}
.name{font-family:'Newsreader',serif;font-weight:400;font-size:64px;letter-spacing:.16em;text-indent:.16em;line-height:1.1;margin-top:34px;white-space:nowrap}
.sub{font-weight:600;font-size:21px;letter-spacing:.36em;text-indent:.36em;opacity:.9;margin-top:20px;white-space:nowrap}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="lock"><img src="mark-moonset-cream.svg"><div class="name">ANDREA SILVERIA</div><div class="sub">COACHING &amp; CONSULTING</div></div>
</body></html>
