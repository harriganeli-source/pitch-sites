<!DOCTYPE html><html><head><meta charset="utf-8"><title>Andrea Silveria logo</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:2190px;background:#EDE9E0;padding:70px 60px;font-family:'Mulish',sans-serif;color:#1A2430;overflow:hidden}
h1{font-weight:400;font-size:34px;margin-bottom:50px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:50px}
.item img{display:block;width:100%;height:auto}
.item .cap{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5a5f66;margin-top:12px}
.cream{background:#F7F3EA}
</style></head><body>
<h1>Andrea Silveria, logo</h1>
<div class="grid">
  <div class="item"><img src="lockup-dark.png"><div class="cap">Full logo on dark</div></div>
  <div class="item"><img src="lockup-light.png"><div class="cap">Full logo on light</div></div>
  <div class="item"><div class="cream"><img src="email-signature.png"></div><div class="cap">Email signature</div></div>
  <div class="item"><img src="email-signature-dark.png"><div class="cap">Email signature on dark</div></div>
  <div class="item"><img src="avatar-dark.png"><div class="cap">The mark on its own, for Substack and LinkedIn</div></div>
  <div class="item"><img src="avatar-light.png"><div class="cap">The mark on light</div></div>
</div>
</body></html>
