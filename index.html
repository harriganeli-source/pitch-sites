<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Sites</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0D0A05;
            color: #F2E8D9;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 2rem;
        }
        h1 { font-size: 1rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.4; margin-bottom: 1rem; }
        a {
            display: block;
            font-size: 2rem;
            font-weight: normal;
            color: #F2E8D9;
            text-decoration: none;
            letter-spacing: 0.1em;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 1; }
    </style>
</head>
<body>
    <h1>Pitch Sites</h1>
    <a href="la-bola/index.html">La Bola</a>
    <a href="avvino/index.html">Avvino</a>
