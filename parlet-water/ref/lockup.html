<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Clean Flow lockup</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B3D91;color:#fff;font-family:Sora,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;border-right:1px solid rgba(255,255,255,.08)}
.card:last-child{border:0}
.mark{width:400px;display:block}
.mark3{width:400px;display:block;margin-bottom:-8px}
.name{font-weight:700;font-size:84px;line-height:1;letter-spacing:-.015em;margin:26px 0 0}
.sub{font-weight:500;font-size:15px;letter-spacing:.34em;margin:14px 0 0;opacity:.85;padding-left:.34em}
.tag{margin-top:40px;font-size:11px;letter-spacing:.14em;opacity:.4;text-transform:uppercase;font-weight:500}
</style></head><body><div class="grid">

<div class="card">
  <svg class="mark" viewBox="180 170 1050 500" xmlns="http://www.w3.org/2000/svg">
    <g fill="#fff">
      <polyline points="290,462 700,192 1110,462" fill="none" stroke="#fff" stroke-width="54" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <rect x="447" y="262" width="40" height="110"/>
      <rect x="437" y="246" width="60" height="22"/>
      <rect x="660" y="340" width="80" height="46"/>
      <rect x="660" y="394" width="80" height="46"/>
      <path d="M235,600 C450,470 680,660 920,580 C1040,540 1120,515 1185,505 C1125,560 1040,612 920,632 C680,702 450,562 235,600 Z"/>
    </g>
  </svg>
  <p class="name">CLEAN FLOW</p>
  <p class="sub">HOME WATER SOLUTIONS</p>
  <div class="tag">One wave, smaller window, Sora 700</div>
</div>

<div class="card">
  <svg class="mark3" viewBox="150 150 1100 470" xmlns="http://www.w3.org/2000/svg">
    <image href="knockout-flat-window3.png" x="0" y="0" width="1402" height="1122"/>
    <rect x="640" y="330" width="125" height="135" fill="#0B3D91"/>
    <rect x="660" y="340" width="80" height="46" fill="#fff"/>
    <rect x="660" y="394" width="80" height="46" fill="#fff"/>
  </svg>
  <p class="name">CLEAN FLOW</p>
  <p class="sub">HOME WATER SOLUTIONS</p>
  <div class="tag">Three waves (current, flattened), smaller window, Sora 700</div>
</div>

</div></body></html>
